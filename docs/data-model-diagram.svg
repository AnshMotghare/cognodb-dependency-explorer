<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#0b0f19; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-package" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="grad-version" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="grad-maintainer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-license" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-vuln" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-vuln" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-vuln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-dep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  </pattern>
  <rect width="1000" height="580" fill="url(#grid)" />

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
    CognoDB Supply Chain Graph Data Model
  </text>
  <text x="500" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">
    Nodes, Relationships, and Multi-Hop Traversal Topology
  </text>

  <!-- RELATIONSHIPS (LINES) -->

  <!-- Maintainer <- Version -->
  <path d="M 430 200 L 230 200" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="270" y="185" width="120" height="22" rx="4" fill="#111827" stroke="rgba(255,255,255,0.1)" />
  <text x="330" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#cbd5e1" font-family="'JetBrains Mono', monospace">:MAINTAINED_BY</text>

  <!-- Version -> License -->
  <path d="M 570 200 L 770 200" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="610" y="185" width="120" height="22" rx="4" fill="#111827" stroke="rgba(255,255,255,0.1)" />
  <text x="670" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#cbd5e1" font-family="'JetBrains Mono', monospace">:LICENSED_UNDER</text>

  <!-- Package -> Version -->
  <path d="M 500 120 L 500 160" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="440" y="130" width="120" height="20" rx="4" fill="#111827" stroke="rgba(255,255,255,0.1)" />
  <text x="500" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#cbd5e1" font-family="'JetBrains Mono', monospace">:HAS_VERSION</text>

  <!-- Version -> Dependent Package (Recursive edge) -->
  <path d="M 500 240 L 500 330" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-dep)" />
  <rect x="420" y="270" width="160" height="24" rx="4" fill="#111827" stroke="#a855f7" />
  <text x="500" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#e9d5ff" font-family="'JetBrains Mono', monospace">:DEPENDS_ON {range}</text>

  <!-- Target Package -> Target Version -->
  <path d="M 500 410 L 500 450" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="440" y="420" width="120" height="20" rx="4" fill="#111827" stroke="rgba(255,255,255,0.1)" />
  <text x="500" y="434" text-anchor="middle" font-size="10" font-weight="700" fill="#cbd5e1" font-family="'JetBrains Mono', monospace">:HAS_VERSION</text>

  <!-- Target Version -> Vulnerability -->
  <path d="M 570 490 L 770 490" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-vuln)" />
  <rect x="615" y="475" width="110" height="22" rx="4" fill="#111827" stroke="#ef4444" />
  <text x="670" y="490" text-anchor="middle" font-size="10" font-weight="700" fill="#fca5a5" font-family="'JetBrains Mono', monospace">:AFFECTED_BY</text>


  <!-- NODES -->

  <!-- 1. Top Package -->
  <g transform="translate(500, 85)" filter="url(#shadow)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="url(#grad-package)" stroke="#a5b4fc" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">(:Package)</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" font-weight="500" fill="#e0e7ff" font-family="'JetBrains Mono', monospace">name, ecosystem</text>
  </g>

  <!-- 2. Version -->
  <g transform="translate(500, 200)" filter="url(#shadow)">
    <rect x="-70" y="-35" width="140" height="70" rx="10" fill="url(#grad-version)" stroke="#a5f3fc" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">(:Version)</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" font-weight="500" fill="#cffafe" font-family="'JetBrains Mono', monospace">version, date</text>
  </g>

  <!-- 3. Maintainer -->
  <g transform="translate(150, 200)" filter="url(#shadow)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="url(#grad-maintainer)" stroke="#a7f3d0" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">(:Maintainer)</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" font-weight="500" fill="#d1fae5" font-family="'JetBrains Mono', monospace">name, email</text>
  </g>

  <!-- 4. License -->
  <g transform="translate(850, 200)" filter="url(#shadow)">
    <rect x="-75" y="-35" width="150" height="70" rx="10" fill="url(#grad-license)" stroke="#fde68a" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">(:License)</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" font-weight="500" fill="#fef3c7" font-family="'JetBrains Mono', monospace">name, type</text>
  </g>

  <!-- 5. Downstream Target Package -->
  <g transform="translate(500, 370)" filter="url(#shadow)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="url(#grad-package)" stroke="#a5b4fc" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">(:Package)</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" font-weight="500" fill="#e0e7ff" font-family="'JetBrains Mono', monospace">name, ecosystem</text>
  </g>

  <!-- 6. Downstream Target Version -->
  <g transform="translate(500, 490)" filter="url(#shadow)">
    <rect x="-70" y="-35" width="140" height="70" rx="10" fill="url(#grad-version)" stroke="#a5f3fc" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">(:Version)</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" font-weight="500" fill="#cffafe" font-family="'JetBrains Mono', monospace">version, date</text>
  </g>

  <!-- 7. Vulnerability -->
  <g transform="translate(850, 490)" filter="url(#glow-vuln)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="url(#grad-vuln)" stroke="#fecaca" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">(:Vulnerability)</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" font-weight="500" fill="#fee2e2" font-family="'JetBrains Mono', monospace">cveId, severity</text>
  </g>
</svg>
